# Compila l'app Android "Mappa Segnale" e pubblica l'APK come artifact scaricabile
name: App segnale cellulare

on:
  push:
    paths:
      - "segnale-cellulare/**"
      - ".github/workflows/segnale-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: segnale-cellulare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test e build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mappa-segnale-apk
          path: segnale-cellulare/app/build/outputs/apk/debug/app-debug.apk
